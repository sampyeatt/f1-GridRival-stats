server {
  listen 80;
  root /usr/share/nginx/html;

  # Angular routes are client-side, so any unknown path must fall back to
  # index.html rather than 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build artefacts are safe to cache indefinitely; index.html is not.
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
