# Configuration is read from a `.env` file next to this compose file, which
# docker compose loads automatically. Copy `.env.example` to `.env` and fill it
# in. Variables marked `:?` are required and compose refuses to start without
# them; the rest fall back to the defaults shown.
services:
  db:
    container_name: f1-grod-db
    image: postgres:17.6-alpine
    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d/
    networks:
      - internalnet
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-f1-data-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - PGPORT=${POSTGRES_PORT:-5435}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-f1-data-user} -d ${POSTGRES_DB:-postgres} -p ${POSTGRES_PORT:-5435}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: f1-grod-backend
    image: f1-grod-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - internalnet
    # Secrets are supplied at deploy time rather than baked into the image. The
    # database settings reuse the db service's variables so the two cannot drift.
    environment:
      - PG_HOST=f1-grod-db
      - PG_PORT=${POSTGRES_PORT:-5435}
      - PG_USER_NAME=${POSTGRES_USER:-f1-data-user}
      - PG_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - PG_DATABASE=${POSTGRES_DB:-postgres}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - RESEND_API_KEY=${RESEND_API_KEY:?RESEND_API_KEY must be set in .env}
      # The scheduler runs in the web process. Set to false to run the API
      # without it (e.g. a second replica that should not duplicate ingest).
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-true}
      - SCHEDULER_TICK_CRON=${SCHEDULER_TICK_CRON:-*/15 * * * *}
      - SCHEDULER_SYNC_CRON=${SCHEDULER_SYNC_CRON:-0 3 * * 1}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - JOLPICA_BASE_URL=${JOLPICA_BASE_URL:-https://api.jolpi.ca/ergast/f1}
      - JOLPICA_USER_AGENT=${JOLPICA_USER_AGENT:-F1GridRivalStats/0.3.0}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: f1-grod-frontend
    image: f1-grod-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - internalnet
    depends_on:
      - backend

  nginx:
    container_name: f1-grod-nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "${HTTP_PORT:-8080}:80"
    networks:
      - internalnet
    depends_on:
      - backend
      - frontend

networks:
  internalnet:
    driver: bridge
