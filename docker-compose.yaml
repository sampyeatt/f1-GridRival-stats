services:
  db:
    container_name: f1-grod-db
    image: postgres:17.6-alpine
    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d/
    networks:
      - internalnet
    environment:
      - POSTGRES_USER=f1-data-user
      - POSTGRES_PASSWORD=database-dockerpassword-here
      - POSTGRES_DB=postgres
      - PGPORT=5435
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1-data-user -d postgres -p 5435"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: f1-grod-backend
    image: f1-grod-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - internalnet
    # Secrets are read from the host at deploy time rather than baked into the
    # image. The file is the same one the app used to load with dotenv.
    env_file:
      - ./backend/src/.env
    environment:
      # The scheduler runs in the web process. Set to false to run the API
      # without it (e.g. a second replica that should not duplicate ingest).
      - SCHEDULER_ENABLED=true
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: f1-grod-frontend
    image: f1-grod-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - internalnet
    depends_on:
      - backend

  nginx:
    container_name: f1-grod-nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    networks:
      - internalnet
    depends_on:
      - backend
      - frontend

networks:
  internalnet:
    driver: bridge
