worker_processes 2;

events {
  worker_connections 2048;
}

http {
  include mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  # Docker's embedded DNS, so an upstream restarting does not leave nginx
  # holding a stale address.
  resolver 127.0.0.11 valid=30s;

  server {
    listen 80;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The app and the API share this origin, which is why no CORS headers are
    # set here and why the backend has CORS off by default. The previous config
    # sent Access-Control-Allow-Origin "*" alongside a credentialed allowlist in
    # Express — the two contradicted each other.

    client_max_body_size 2m;

    # Static app, served from the frontend image's own nginx on port 80.
    location / {
      proxy_pass http://f1-grod-frontend:80;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      proxy_pass http://f1-grod-backend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Ingest and re-score run synchronously and can take a while on a full
      # season backfill.
      proxy_read_timeout 300s;
    }
  }
}
